api_platform:
    title: Poker web API
    version: 1.0.0
    formats:
        json: ['application/json']
        jsonld: ['application/ld+json']
    error_formats:
        json: ['application/json']
        jsonld: ['application/problem+json']
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
