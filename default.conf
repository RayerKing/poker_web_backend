server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    location / {
        # Zkusí najít reálný soubor, pokud neexistuje, pošle požadavek na index.php (Symfony router)
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        # 'backend' odpovídá názvu služby v compose.yaml. FPM běží na portu 9000.
        fastcgi_pass backend:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        
        # Definice parametrů pro PHP-FPM
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        
        internal;
    }

    # Ostatní PHP soubory z bezpečnostních důvodů zakážeme
    location ~ \.php$ {
        return 404;
    }

    error_log /var/log/nginx/project_error.log;
    access_log /var/log/nginx/project_access.log;
}